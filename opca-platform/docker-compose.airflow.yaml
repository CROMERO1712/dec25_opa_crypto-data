# Airflow (orchestration de la collecte) - OPCA Crypto Data
# Lancement : docker compose -p opca_airflow -f docker-compose.airflow.yaml up -d
# Interface : http://<ip-vm>:8081  (identifiants definis dans .env)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: opca-airflow:2.9.3
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?renseigner AIRFLOW_SECRET_KEY dans .env}
    AIRFLOW__WEBSERVER__WORKERS: "1"
    # Base de donnees du projet (lue par les scripts de collecte)
    DB_HOST: 172.17.0.1
    DB_PORT: "5432"
    DB_NAME: dst_db
    DB_USER: daniel
    DB_PASSWORD: ${DB_PASSWORD:?renseigner DB_PASSWORD dans .env}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./collectors:/opt/airflow/collectors:ro
    - ./ml:/opt/airflow/ml:ro

services:
  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username admin --password '${AIRFLOW_ADMIN_PASSWORD:?renseigner AIRFLOW_ADMIN_PASSWORD dans .env}'
        --firstname Admin --lastname OPCA --role Admin --email admin@example.com || true)
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 1g

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1200m

volumes:
  airflow_pg_data:
