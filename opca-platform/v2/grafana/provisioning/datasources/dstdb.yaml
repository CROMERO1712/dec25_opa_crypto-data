apiVersion: 1
datasources:
  - name: dst_db
    uid: opca-dstdb
    type: grafana-postgresql-datasource
    access: proxy
    url: 172.17.0.1:5433
    user: $GRAFANA_DB_USER
    isDefault: true
    jsonData:
      database: opca_db
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
